<title>Для котейки ❤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
  /* Один экран: чёрный фон, сердце складывается из надписей; по центру скрытая кнопка с посланием */
  :root {
    --night: #050304;
    --night-veil: rgba(5, 3, 4, 0.88);
    --neon: #ff3b47;
    --blush: #ffb3b8;
    --petal: #ffe5e7;
    --hint: #5a3438;
    --font-phrase: system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
    --font-letter: "Cormorant Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--blush);
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .hint {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 0 16px calc(14px + env(safe-area-inset-bottom, 0px));
    text-align: center; font: 12px/1.4 var(--font-phrase);
    color: var(--hint); letter-spacing: 0.04em; pointer-events: none;
  }

  /* Скрытая кнопка поверх центра сердца: ничем себя не выдаёт */
  #open-letter {
    position: fixed; border: 0; padding: 0; margin: 0;
    background: transparent; border-radius: 50%; cursor: default;
  }
  #open-letter:focus { outline: none; }
  #open-letter:focus-visible { outline: 1px dashed var(--hint); outline-offset: 4px; }

  /* Страница с посланием */
  #letter {
    position: fixed; inset: 0; z-index: 5;
    background: var(--night-veil);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    opacity: 0; transition: opacity 0.6s ease;
    user-select: text; -webkit-user-select: text;
  }
  #letter.shown { opacity: 1; }
  .letter-inner {
    min-height: 100%;
    display: flex; flex-direction: column; justify-content: center; gap: 28px;
    max-width: 34rem; margin: 0 auto;
    padding-block: calc(48px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px));
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
    transform: translateY(12px); transition: transform 0.8s ease;
  }
  #letter.shown .letter-inner { transform: none; }
  .letter-mark { font: 600 12px/1 var(--font-phrase); letter-spacing: 0.22em; text-transform: uppercase; color: var(--neon); }
  .letter-body { display: flex; flex-direction: column; gap: 1em; font: 500 clamp(21px, 5.4vw, 27px)/1.45 var(--font-letter); color: var(--petal); }
  .letter-body p { margin: 0; text-wrap: pretty; }
  .letter-sign { font: italic 500 clamp(20px, 5vw, 25px)/1.3 var(--font-letter); color: var(--blush); text-align: right; }
  .letter-counter {
    margin: 0; font: 500 14px/1.5 var(--font-phrase); color: var(--blush);
    letter-spacing: 0.02em; font-variant-numeric: tabular-nums;
    opacity: 0; transition: opacity 1s ease;
  }
  .letter-counter.shown { opacity: 1; }
  .letter-counter b { color: var(--petal); font-weight: 600; }
  /* Печатная машинка: ещё не напечатанный текст уже занимает место, поэтому строки не прыгают */
  .typed-rest { color: transparent; }
  .typing .typed-done::after {
    content: ""; display: inline-block; width: 2px; height: 0.9em; margin-left: 1px;
    background: var(--neon); vertical-align: -0.1em; animation: caret 0.8s steps(1) infinite;
  }
  @keyframes caret { 50% { opacity: 0; } }
  #close-letter {
    align-self: flex-start;
    font: 500 15px/1 var(--font-phrase); color: var(--blush);
    background: transparent; border: 1px solid var(--hint); border-radius: 999px;
    padding: 12px 20px; cursor: pointer;
  }
  #close-letter:focus-visible { outline: 2px solid var(--neon); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    #letter, .letter-inner { transition: none; }
  }
</style>

<body>
<canvas id="heart" aria-label="Сердце из фразы «Я тебя люблю» на 36 языках"></canvas>
<button id="open-letter" type="button" aria-label="Открыть послание"></button>
<div class="hint">Нажми на экран</div>

<section id="letter" hidden aria-label="Послание">
  <div class="letter-inner">
    <div class="letter-mark">2,5 года вместе</div>
    <!-- ПОСЛАНИЕ: текст можно поменять прямо в этих абзацах -->
    <div class="letter-body">
      <p>С нашей годовщиной, котейка!</p>
      <p>Два с половиной года вместе, и каждый день я снова выбираю тебя.</p>
      <p>Желаю, чтобы рядом всегда было тепло, спокойно и весело, а всё задуманное сбывалось.</p>
      <p>Я тебя очень-очень сильно люблю.</p>
    </div>
    <p class="letter-counter" id="together" aria-live="off"></p>
    <div class="letter-sign">— кот любимый</div>
    <button id="close-letter" type="button">← Назад к сердцу</button>
  </div>
</section>

<script>
const PHRASES = ["Miluji tě", "Ti amo", "Te quiero", "Мен сені сүйемін", "Я тебя люблю", "Mi amas vin", "Jeg elsker deg", "Aš tave myliu", "Σ' αγαπώ", "Minä rakastan sinua", "Eu te amo", "사랑해", "我爱你", "I love you", "Ik hou van jou", "Je t'aime", "Ich liebe dich", "Kocham cię", "Anh yêu em", "Seni seviyorum", "मैं तुमसे प्यार करता हूँ", "Aku cinta kamu", "Es tevi mīlu", "أحبك", "Nakupenda", "Я цябе кахаю", "愛してる", "მიყვარხარ", "Szeretlek", "Te iubesc", "ฉันรักเธอ", "Ես քեզ սիրում եմ", "Jag älskar dig", "Is breá liom thú", "Ma armastan sind", "אני אוהב אותך"];
// Свои словечки: каждое ровно один раз, светлее остальных и вспыхивают чаще
const PERSONAL = ["котейка", "кот любимый", "2,5 года", "мой котейка", "люблю тебя, котейка", "кошка", "любимая"];
const PERSONAL_COLOR = "#ffd9dc";
// В основном неоново-красный, изредка светлые надписи — как в референсе
const COLORS = ["#ff3b47", "#ff3b47", "#ff3b47", "#ff4f4f", "#ff2d3c", "#ff6b6b", "#ff8a8a", "#ffd0d0"];
const css = getComputedStyle(document.documentElement);
const FONT = css.getPropertyValue("--font-phrase").trim();
const NIGHT = css.getPropertyValue("--night").trim();
const NEON = css.getPropertyValue("--neon").trim();const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");
// Готовые надписи «запекаются» сюда один раз, чтобы не перерисовывать сотни слов каждый кадр
const layer = document.createElement("canvas");
const lctx = layer.getContext("2d");
const openBtn = document.getElementById("open-letter");
const letter = document.getElementById("letter");

// Классическая параметрическая кривая сердца: x в [-16, 16], y в [-12, 17]
function heartPoint(t) {
  const x = 16 * Math.sin(t) ** 3;
  const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return [x, -y];
}

let W = 0, H = 0, dpr = 1, unit = 1, cx = 0, cy = 0;
let poly = [], words = [], personal = [], next = 0, start = 0, doneAt = Infinity;
const toScreen = (x, y) => [cx + x * unit, cy + y * unit];
// Появление по одному — суть рисунка, поэтому оно есть всегда; при «уменьшить движение» убираем только всплытие, пульс и вспышки
const FADE = 0.7;                             // сколько проявляется одно слово
const OUTLINE_TIME = 4.5, FILL_TIME = 6.5;    // контур, затем середина

// Маска сердца: один байт на CSS-пиксель, «внутри ли точка» — это просто чтение из массива.
// Раскладка проверяет десятки тысяч точек, и честная геометрия на 240 вершин замораживала страницу на секунды.
// Две маски: точная форма — для середины, и чуть шире — для слов контура: они лишь
// касаются края, чтобы силуэт был живым, но не рваным.
const OVERHANG = 1.03;
let mask = null, looseMask = null;
function buildMask(scale) {
  const m = document.createElement("canvas");
  m.width = W; m.height = H;
  const mc = m.getContext("2d");
  mc.beginPath();
  poly.forEach(([x, y], i) => {
    const px = cx + (x - cx) * scale, py = cy + (y - cy) * scale;
    i ? mc.lineTo(px, py) : mc.moveTo(px, py);
  });
  mc.closePath();
  mc.fill();
  const data = mc.getImageData(0, 0, W, H).data;
  const out = new Uint8Array(W * H);
  for (let i = 0; i < out.length; i++) out[i] = data[i * 4 + 3] > 127 ? 1 : 0;
  return out;
}
function inHeart(x, y, m = mask) {
  x |= 0; y |= 0;
  return x >= 0 && y >= 0 && x < W && y < H && m[y * W + x] === 1;
}

// Слово со своими точными габаритами. Размер берём из того, как браузер реально рисует текст:
// у хинди, тайского и других письменностей знаки выходят выше и ниже строки, и по одной ширине
// и кеглю их не оценить — именно из-за этого раньше надписи налезали друг на друга.
const metrics = new Map();
function measure(text, size) {
  const key = text + "|" + size;
  let m = metrics.get(key);
  if (!m) {
    ctx.font = `700 ${size}px ${FONT}`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const r = ctx.measureText(text);
    m = { left: r.actualBoundingBoxLeft ?? r.width / 2, right: r.actualBoundingBoxRight ?? r.width / 2,
          asc: r.actualBoundingBoxAscent ?? size * 0.55, desc: r.actualBoundingBoxDescent ?? size * 0.3 };
    metrics.set(key, m);
  }
  return m;
}
// Фразы берутся «из колоды»: все языки идут по кругу и встречаются примерно поровну.
// Не легла фраза — уходит в конец колоды, а не теряется.
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let deck = [], personalLeft = [];
// На контуре — только небольшие слова почти одного кегля: так силуэт читается ровной линией.
// Крупные и разные по размеру надписи живут внутри.
function makeWord(personalWord = false, edge = false) {
  const mine = personalWord && personalLeft.length > 0;
  const text = mine ? personalLeft[0] : deck[0];
  const big = !edge && Math.random() < 0.18;
  const scale = edge ? 0.7 + Math.random() * 0.1 : big ? 0.9 + Math.random() * 0.25 : 0.55 + Math.random() * 0.28;
  const size = Math.max(8, Math.round(unit * scale));
  const m = measure(text, size);
  const padX = size * 0.13, padY = size * 0.07;   // половина зазора между соседями
  return { text, size, mine, left: m.left + padX, right: m.right + padX, asc: m.asc + padY, desc: m.desc + padY,
           color: mine ? PERSONAL_COLOR : COLORS[Math.floor(Math.random() * COLORS.length)] };
}
// Ставит слово так, чтобы центр его рамки оказался в точке (bx, by)
function placeAt(w, bx, by) {
  w.x = bx - (w.right - w.left) / 2; w.y = by - (w.desc - w.asc) / 2;
  w.l = w.x - w.left; w.r = w.x + w.right; w.t = w.y - w.asc; w.b = w.y + w.desc;
  return w;
}
const hits = (a, b) => a.l < b.r && b.l < a.r && a.t < b.b && b.t < a.b;
// Рамка целиком внутри сердца: проверяем углы и точки по краям, иначе длинное слово
// может перекрыть ложбинку сверху, хотя все четыре угла внутри
function boxInside(w, m = mask) {
  // Края рамки проверяем с шагом 2 px — дешёво благодаря маске
  for (let x = w.l; x < w.r; x += 2) if (!inHeart(x, w.t, m) || !inHeart(x, w.b, m)) return false;
  for (let y = w.t; y < w.b; y += 2) if (!inHeart(w.l, y, m) || !inHeart(w.r, y, m)) return false;
  return inHeart(w.r, w.t, m) && inHeart(w.r, w.b, m);
}

// Сетка для поиска соседей: слово сравнивается только с теми, кто лежит в тех же клетках
function makeGrid(cell) {
  const cells = new Map();
  const each = (w, fn) => {
    for (let gx = Math.floor(w.l / cell); gx <= Math.floor(w.r / cell); gx++)
      for (let gy = Math.floor(w.t / cell); gy <= Math.floor(w.b / cell); gy++) fn(gx * 4096 + gy);
  };
  return {
    fits(w) {
      let ok = true;
      each(w, k => { if (ok) for (const o of cells.get(k) || []) if (hits(o, w)) { ok = false; break; } });
      return ok;
    },
    add(w) { each(w, k => { if (!cells.has(k)) cells.set(k, []); cells.get(k).push(w); }); },
  };
}

// Вся раскладка считается заранее, а потом слова проявляются по одному в порядке очереди:
// сначала вдоль контура (как перо, от ложбинки по часовой стрелке), затем середина сверху вниз.
// Слова контура слегка выступают за край, середина лежит строго внутри.
function buildPlan() {
  const grid = makeGrid(Math.max(16, unit * 2));
  deck = shuffle([...PHRASES]); personalLeft = shuffle([...PERSONAL]);
  // Одинаковые фразы не ставим ближе этого расстояния друг к другу
  const seen = new Map(), MIN_SAME = unit * 9;
  const farFromSame = w => (seen.get(w.text) || []).every(([x, y]) => Math.hypot(x - w.x, y - w.y) > MIN_SAME);
  // Не влезшая фраза пробует ещё несколько мест и только потом уступает очередь —
  // иначе длинные фразы почти не попадали бы в сердце, а короткие повторялись
  let tries = 0;
  const tryPlace = (w, m, list) => {
    const ok = w.l > 4 && w.r < W - 4 && w.t > 4 && w.b < H - 4 && boxInside(w, m) && grid.fits(w) && farFromSame(w);
    if (w.mine) { const word = personalLeft.shift(); if (!ok) personalLeft.push(word); }
    else if (ok || ++tries >= 25) { deck.push(deck.shift()); tries = 0; }
    if (!ok) return false;
    grid.add(w); list.push(w);
    if (!seen.has(w.text)) seen.set(w.text, []);
    seen.get(w.text).push([w.x, w.y]);
    return true;
  };
  const ring = [], STEPS = 720;
  const edge = Array.from({ length: STEPS }, (_, i) => toScreen(...heartPoint(2 * Math.PI * i / STEPS)));
  for (let i = 0; i < STEPS; i++) {
    const [px, py] = edge[i], [ax, ay] = edge[(i + STEPS - 1) % STEPS], [bx, by] = edge[(i + 1) % STEPS];
    // Нормаль к контуру, направленная внутрь сердца
    let nx = -(by - ay), ny = bx - ax;
    const len = Math.hypot(nx, ny) || 1; nx /= len; ny /= len;
    if (!inHeart(px + nx * 3, py + ny * 3)) { nx = -nx; ny = -ny; }
    const w = makeWord(false, true);
    const halfN = Math.abs(nx) * (w.left + w.right) / 2 + Math.abs(ny) * (w.asc + w.desc) / 2;
    // Слово почти целиком внутри: наружу заходит лишь самый край надписи
    const inset = halfN * 0.85 + unit * 0.05;
    placeAt(w, px + nx * inset, py + ny * inset);
    tryPlace(w, looseMask, ring);
  }
  const fill = [];
  const randomPoint = () => {
    for (;;) {
      const x = cx + (Math.random() * 32 - 16) * unit, y = cy + (Math.random() * 29 - 12) * unit;
      if (inHeart(x, y)) return [x, y];
    }
  };
  // Свои словечки ставим первыми, пока внутри много места, — так попадают все, по одному разу
  for (let a = 0; personalLeft.length && a < 4000; a++) tryPlace(placeAt(makeWord(true), ...randomPoint()), mask, fill);
  for (let misses = 0; misses < 8000;) {
    if (tryPlace(placeAt(makeWord(), ...randomPoint()), mask, fill)) misses = 0;
    else misses++;
  }
  fill.forEach(w => { w.order = w.y + (Math.random() - 0.5) * unit * 4; });
  fill.sort((a, b) => a.order - b.order);

  const t0 = 0.4, t1 = t0 + OUTLINE_TIME + 0.3;
  ring.forEach((w, i) => { w.at = t0 + OUTLINE_TIME * i / ring.length; });
  fill.forEach((w, i) => { w.at = t1 + FILL_TIME * i / fill.length; });
  return [...ring, ...fill];
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);   // у айфонов плотность 3 — иначе мелкий текст мылится
  W = innerWidth; H = innerHeight;
  for (const c of [canvas, layer]) { c.width = W * dpr; c.height = H * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  unit = Math.min((W - 12) / 34.5, (H - 60) / 31.5);   // небольшой запас под слова, выступающие за контур
  cx = W / 2; cy = H / 2 - 2.5 * unit;
  poly = Array.from({ length: 240 }, (_, i) => toScreen(...heartPoint(2 * Math.PI * i / 240)));
  mask = buildMask(1);
  looseMask = buildMask(OVERHANG);

  // Невидимая кнопка — в середине сердца, с запасом под палец
  const bw = Math.max(unit * 9, 120), bh = Math.max(unit * 5.6, 88), by = cy + unit;
  Object.assign(openBtn.style, { left: `${cx - bw / 2}px`, top: `${by - bh / 2}px`, width: `${bw}px`, height: `${bh}px` });

  words = buildPlan(); next = 0; doneAt = Infinity;
  personal = words.filter(w => w.mine);
  start = performance.now() / 1000;
  lctx.clearRect(0, 0, W, H);
}

function drawWord(c, w, alpha, glow, color = w.color, dy = 0) {
  c.globalAlpha = alpha;
  c.font = `700 ${w.size}px ${FONT}`;
  c.fillStyle = color;
  c.shadowColor = NEON;
  c.shadowBlur = glow;
  c.fillText(w.text, w.x, w.y + dy);
}
const easeOut = k => 1 - (1 - k) ** 3;

function heartbeat(t) {
  const p = t % 1.3;
  return Math.exp(-(((p - 0.10) / 0.06) ** 2)) + 0.6 * Math.exp(-(((p - 0.32) / 0.07) ** 2));
}

// Маленькие сердечки от нажатия
const bursts = [];
canvas.addEventListener("pointerdown", e => {
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 120;
    bursts.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60,
                  born: performance.now() / 1000, size: 6 + Math.random() * 8, color: COLORS[i % COLORS.length] });
  }
});
function tinyHeart(x, y, s) {
  ctx.beginPath();
  for (let i = 0; i <= 24; i++) {
    const [hx, hy] = heartPoint(2 * Math.PI * i / 24);
    const px = x + hx * s / 17, py = y + hy * s / 17;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.fill();
}

// Начало отношений — от этой даты считается «вместе уже…» (год-месяц-день)
const TOGETHER_SINCE = new Date("2024-05-01T00:00:00");

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
const counter = document.getElementById("together");
function updateCounter() {
  const sec = Math.max(0, Math.floor((Date.now() - TOGETHER_SINCE) / 1000));
  const d = Math.floor(sec / 86400), h = Math.floor(sec / 3600) % 24, m = Math.floor(sec / 60) % 60, s = sec % 60;
  counter.innerHTML = `Мы вместе уже <b>${d}</b> ${plural(d, "день", "дня", "дней")}, ` +
    `<b>${h}</b> ${plural(h, "час", "часа", "часов")}, <b>${m}</b> ${plural(m, "минуту", "минуты", "минут")} ` +
    `и <b>${s}</b> ${plural(s, "секунду", "секунды", "секунд")}`;
}
let counterTimer = 0;

// Печатная машинка: заголовок, абзацы и подпись печатаются по очереди, по букве.
// Нажатие по посланию допечатывает всё сразу. Печатается только при первом открытии.
const typedEls = [letter.querySelector(".letter-mark"), ...letter.querySelectorAll(".letter-body p"), letter.querySelector(".letter-sign")];
typedEls.forEach(el => { el.dataset.full = el.textContent.trim(); });
let typeTimer = 0, typedOnce = false;
function setTyped(el, n) {
  const full = el.dataset.full;
  el.innerHTML = "";
  const done = document.createElement("span"), rest = document.createElement("span");
  done.className = "typed-done"; rest.className = "typed-rest";
  done.textContent = full.slice(0, n); rest.textContent = full.slice(n);
  el.append(done, rest);
}
function finishTyping() {
  clearTimeout(typeTimer);
  typedEls.forEach(el => { el.textContent = el.dataset.full; el.classList.remove("typing"); });
  counter.classList.add("shown");
  typedOnce = true;
}
function typeLetter() {
  if (typedOnce) { finishTyping(); return; }
  typedEls.forEach(el => setTyped(el, 0));
  let i = 0, n = 0;
  const step = () => {
    const el = typedEls[i];
    el.classList.add("typing");
    setTyped(el, ++n);
    if (n < el.dataset.full.length) { typeTimer = setTimeout(step, el.dataset.full[n - 1] === "," ? 160 : 38); return; }
    el.classList.remove("typing");
    if (i === typedEls.length - 2) counter.classList.add("shown");   // счётчик — после последнего абзаца
    i++; n = 0;
    if (i < typedEls.length) typeTimer = setTimeout(step, 420);
    else typedOnce = true;
  };
  typeTimer = setTimeout(step, 500);
}
letter.addEventListener("click", e => { if (!typedOnce && e.target.id !== "close-letter") finishTyping(); });

// Послание
function showLetter() {
  letter.hidden = false;
  updateCounter();
  counterTimer = setInterval(updateCounter, 1000);
  typeLetter();
  requestAnimationFrame(() => requestAnimationFrame(() => letter.classList.add("shown")));
  document.getElementById("close-letter").focus({ preventScroll: true });
}
function hideLetter() {
  clearInterval(counterTimer);
  if (!typedOnce) finishTyping();
  letter.classList.remove("shown");
  setTimeout(() => { letter.hidden = true; }, reduceMotion ? 0 : 600);
  openBtn.focus({ preventScroll: true });
}
openBtn.addEventListener("click", showLetter);
document.getElementById("close-letter").addEventListener("click", hideLetter);
addEventListener("keydown", e => { if (e.key === "Escape" && !letter.hidden) hideLetter(); });

let last = performance.now() / 1000;
const sparkles = [];
function frame() {
  const now = performance.now() / 1000, t = now - start, dt = Math.min(0.05, now - last);
  last = now;
  for (const c of [ctx, lctx]) { c.textAlign = "center"; c.textBaseline = "middle"; }

  // Полностью проявившиеся слова «запекаем» в слой; живые — те, что между next и текущим моментом
  while (next < words.length && t - words[next].at >= FADE) {
    const w = words[next++];
    drawWord(lctx, w, 1, unit * (w.mine ? 0.9 : 0.35));
  }
  if (next === words.length && doneAt === Infinity) doneAt = now;

  // Когда сердце собрано, оно мягко бьётся
  const beat = !reduceMotion && now > doneAt ? heartbeat(now - doneAt) * Math.min(1, (now - doneAt) / 1.5) : 0;
  const s = 1 + 0.03 * beat;

  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  ctx.fillStyle = NIGHT;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(cx, cy + 2.5 * unit); ctx.scale(s, s); ctx.translate(-cx, -(cy + 2.5 * unit));
  ctx.drawImage(layer, 0, 0, W, H);

  // Новое слово всплывает снизу и разгорается: сначала светлое с сильным свечением, потом своего цвета
  for (let i = next; i < words.length && words[i].at <= t; i++) {
    const w = words[i], k = easeOut(Math.min(1, (t - w.at) / FADE));
    drawWord(ctx, w, k, unit * (0.35 + 1.2 * (1 - k)), k < 0.5 ? "#ffe9ea" : w.color, reduceMotion ? 0 : (1 - k) * unit * 0.8);
  }

  // Редкие вспышки отдельных слов; свои словечки вспыхивают в половине случаев
  if (now > doneAt && !reduceMotion && Math.random() < dt * 6) {
    const pool = personal.length && Math.random() < 0.5 ? personal : words;
    sparkles.push({ w: pool[Math.floor(Math.random() * pool.length)], born: now });
  }
  for (let i = sparkles.length - 1; i >= 0; i--) {
    const sp = sparkles[i], age = now - sp.born;
    if (age > 1.2) { sparkles.splice(i, 1); continue; }
    drawWord(ctx, sp.w, Math.sin(Math.PI * age / 1.2), unit * 0.9, "#fff1f1");
  }
  ctx.restore();

  ctx.shadowBlur = 0;
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i], age = now - b.born;
    if (age > 1.6) { bursts.splice(i, 1); continue; }
    b.vy += 90 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
    ctx.globalAlpha = 1 - age / 1.6;
    ctx.fillStyle = b.color;
    tinyHeart(b.x, b.y, b.size);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

let resizeTimer = 0;
// На iPhone «resize» приходит и когда прячется адресная строка — из-за этого не начинаем заново
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (Math.abs(innerWidth - W) > 1 || Math.abs(innerHeight - H) > 160) resize();
  }, 150);
});
resize();
requestAnimationFrame(frame);
</script>
</body>
